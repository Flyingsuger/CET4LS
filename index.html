<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CET4 Listening Simulator</title>

<style>
:root {
    --bg1: #f7f9ff;
    --bg2: #edf4ff;
    --glass: rgba(255, 255, 255, 0.64);
    --glass-strong: rgba(255, 255, 255, 0.86);
    --stroke: rgba(255, 255, 255, 0.7);
    --border: rgba(120, 140, 180, 0.22);
    --text: #172033;
    --muted: #6e7586;
    --blue: #007aff;
    --blue2: #5ac8fa;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --purple: #af52de;
    --shadow: 0 22px 70px rgba(31, 45, 80, 0.16);
    --soft-shadow: 0 12px 34px rgba(31, 45, 80, 0.1);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background:
        radial-gradient(circle at 8% 8%, rgba(90, 200, 250, 0.36), transparent 32%),
        radial-gradient(circle at 90% 12%, rgba(175, 82, 222, 0.22), transparent 30%),
        radial-gradient(circle at 70% 88%, rgba(52, 199, 89, 0.16), transparent 34%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,0.38) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.38) 1px, transparent 1px);
    background-size: 38px 38px;
    opacity: 0.45;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
    z-index: -1;
}

.app-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    padding-top: var(--safe-top);
    background: rgba(247,250,255,0.68);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.75);
}

.header-inner {
    max-width: 1380px;
    margin: 0 auto;
    padding: 14px 22px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.logo {
    width: 54px;
    height: 54px;
    border-radius: 19px;
    display: grid;
    place-items: center;
    color: white;
    font-size: 25px;
    font-weight: 850;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,255,255,0.18)),
        linear-gradient(145deg, var(--blue), var(--purple));
    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.9),
        0 14px 30px rgba(0,122,255,0.26);
}

.brand h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -0.35px;
    line-height: 1.15;
}

.brand p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
}

button,
.file-btn,
select {
    font-family: inherit;
}

button,
.file-btn {
    min-height: 46px;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.72);
    color: #102033;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.94), rgba(255,255,255,0.48));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.92),
        0 8px 22px rgba(31,45,80,0.1);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform .16s ease;
}

button:active,
.file-btn:active {
    transform: scale(0.97);
}

button.primary {
    color: white;
    background: linear-gradient(145deg, #0a84ff, #007aff);
}

button.green {
    color: white;
    background: linear-gradient(145deg, #40d56b, #34c759);
}

button.red {
    color: white;
    background: linear-gradient(145deg, #ff6961, #ff3b30);
}

button.orange {
    color: white;
    background: linear-gradient(145deg, #ffb340, #ff9500);
}

button.purple {
    color: white;
    background: linear-gradient(145deg, #c477ee, #af52de);
}

input[type="file"] {
    display: none;
}

.app-shell {
    max-width: 1380px;
    margin: 22px auto 80px;
    padding: 0 22px calc(90px + var(--safe-bottom));
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 22px;
    align-items: start;
}

.exam-area {
    min-width: 0;
}

.glass-card {
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 34px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow);
}

.paper-wrap {
    position: relative;
    padding: 28px;
    overflow: hidden;
}

.paper {
    position: relative;
    min-height: 760px;
    overflow: hidden;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.86);
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,1),
        0 8px 30px rgba(31,45,80,0.08);
}

.paper-content {
    position: relative;
    z-index: 2;
    padding: 42px 46px 56px;
}

#drawCanvas {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
}

#drawCanvas.enabled {
    pointer-events: auto;
    cursor: crosshair;
    touch-action: none;
}

.exam-title {
    text-align: center;
    padding-bottom: 20px;
    margin-bottom: 26px;
    border-bottom: 2px solid rgba(20,25,35,0.75);
}

.exam-title h2 {
    margin: 0;
    font-size: 30px;
    letter-spacing: -0.5px;
}

.exam-title p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
}

.notice {
    margin-bottom: 28px;
    padding: 18px 20px;
    border-radius: 22px;
    border: 1px solid rgba(0,122,255,0.16);
    background: linear-gradient(145deg, rgba(0,122,255,0.11), rgba(90,200,250,0.08));
    line-height: 1.75;
    color: #173764;
}

.section {
    margin-top: 38px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid rgba(20,25,35,0.65);
}

.section-heading h3 {
    margin: 0;
    font-size: 25px;
}

.section-heading span {
    color: var(--muted);
    font-size: 14px;
}

.directions {
    margin-bottom: 22px;
    color: #3d465c;
    line-height: 1.85;
    font-size: 15.5px;
}

.group {
    margin: 22px 0;
    padding: 24px;
    border-radius: 26px;
    border: 1px solid rgba(120,140,180,0.2);
    background: rgba(255,255,255,0.74);
    box-shadow: var(--soft-shadow);
}

.group-top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
}

.group-title {
    font-size: 20px;
    font-weight: 850;
}

.pill {
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(0,122,255,0.1);
    color: #075fb8;
    font-size: 13px;
    font-weight: 750;
    white-space: nowrap;
}

.group-intro {
    margin-bottom: 16px;
    color: #40495b;
    font-style: italic;
    line-height: 1.7;
}

details {
    margin: 12px 0 18px;
    padding: 14px 16px;
    border-radius: 20px;
    border: 1px dashed rgba(100,120,160,0.28);
    background: rgba(247,249,255,0.75);
}

summary {
    cursor: pointer;
    font-weight: 800;
    color: #1d2a40;
    user-select: none;
}

.transcript {
    margin-top: 12px;
    color: #3d4657;
    line-height: 1.85;
    white-space: pre-wrap;
    font-size: 15px;
}

.question {
    padding: 20px 0;
    border-top: 1px dashed rgba(100,120,160,0.28);
}

.question:first-of-type {
    border-top: none;
}

.q-stem {
    margin-bottom: 13px;
    font-size: 17px;
    line-height: 1.65;
    font-weight: 850;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.option {
    min-height: 58px;
    padding: 14px 16px;
    border-radius: 20px;
    border: 1.5px solid rgba(120,140,180,0.22);
    background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(255,255,255,0.62));
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
    line-height: 1.55;
    font-size: 15.5px;
}

.option:active {
    transform: scale(0.985);
}

.option input {
    width: 18px;
    height: 18px;
    margin-top: 3px;
    accent-color: var(--blue);
}

.option.selected {
    border-color: rgba(0,122,255,0.72);
    background: linear-gradient(145deg, rgba(0,122,255,0.16), rgba(90,200,250,0.12));
}

.option.correct {
    border-color: rgba(52,199,89,0.8);
    background: linear-gradient(145deg, rgba(52,199,89,0.18), rgba(52,199,89,0.08));
}

.option.wrong {
    border-color: rgba(255,59,48,0.82);
    background: linear-gradient(145deg, rgba(255,59,48,0.16), rgba(255,59,48,0.07));
}

.analysis {
    display: none;
    margin-top: 14px;
    padding: 16px 18px;
    border-radius: 20px;
    border: 1px solid rgba(120,140,180,0.22);
    background: rgba(247,249,255,0.82);
    line-height: 1.75;
    font-size: 15px;
}

.analysis.show {
    display: block;
}

.correct-text {
    color: var(--green);
    font-weight: 850;
}

.wrong-text {
    color: var(--red);
    font-weight: 850;
}

.empty {
    padding: 120px 30px;
    text-align: center;
    color: var(--muted);
}

.empty h2 {
    margin: 0 0 10px;
    color: var(--text);
    font-size: 28px;
}

.side-panel {
    position: sticky;
    top: calc(98px + var(--safe-top));
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.panel-card {
    padding: 18px;
    border-radius: 32px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow);
}

.panel-card h3 {
    margin: 0 0 14px;
    font-size: 18px;
}

select {
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 18px;
    border: 1px solid rgba(120,140,180,0.25);
    background: rgba(255,255,255,0.74);
    color: var(--text);
    font-size: 15px;
    outline: none;
}

.builtin-row {
    display: grid;
    gap: 10px;
}

.audio-player {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.wave-box {
    position: relative;
}

#waveform {
    width: 100%;
    height: 118px;
    border-radius: 24px;
    display: block;
    background: #081426;
    cursor: pointer;
    touch-action: none;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 24px rgba(0,0,0,0.12);
}

#waveform.locked-wave {
    cursor: not-allowed;
}

.wave-tip {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
}

.seek-wrap {
    padding: 12px;
    border-radius: 22px;
    background: rgba(255,255,255,0.58);
    border: 1px solid rgba(120,140,180,0.18);
}

.time-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
}

#seek {
    width: 100%;
    accent-color: var(--blue);
}

#seek.locked {
    opacity: 0.45;
    pointer-events: none;
}

.audio-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.progress-big {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    padding: 14px;
    border-radius: 22px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(120,140,180,0.18);
    text-align: center;
}

.stat b {
    display: block;
    font-size: 25px;
    color: var(--blue);
}

.stat span {
    color: var(--muted);
    font-size: 13px;
}

.progress-track {
    height: 12px;
    margin-top: 14px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(120,140,180,0.2);
}

.progress-inner {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--blue2));
    transition: width .22s ease;
}

.note-area {
    width: 100%;
    min-height: 180px;
    padding: 14px;
    border-radius: 22px;
    border: 1px solid rgba(120,140,180,0.22);
    background: rgba(255,255,255,0.72);
    resize: vertical;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.65;
}

.result-panel {
    display: none;
    margin-bottom: 18px;
    padding: 24px;
    border-radius: 32px;
    background: linear-gradient(145deg, rgba(255,255,255,0.82), rgba(255,255,255,0.54));
    border: 1px solid var(--stroke);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow);
}

.result-panel.show {
    display: block;
}

.result-panel h2 {
    margin: 0 0 14px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.result-tile {
    padding: 18px 14px;
    border-radius: 24px;
    background: rgba(255,255,255,0.66);
    border: 1px solid rgba(120,140,180,0.18);
    text-align: center;
}

.result-tile b {
    display: block;
    font-size: 30px;
    color: var(--blue);
}

.result-tile span {
    color: var(--muted);
    font-size: 13px;
}

.wrong-list {
    margin-top: 16px;
    line-height: 1.8;
}

.floating-dock {
    display: none;
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(14px + var(--safe-bottom));
    z-index: 1200;
    padding: 10px;
    border-radius: 30px;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(255,255,255,0.75);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 18px 60px rgba(31,45,80,0.2);
}

.floating-dock button {
    min-height: 44px;
    padding: 10px 8px;
    font-size: 13px;
}

@media (max-width: 1120px) {
    .app-shell {
        grid-template-columns: 1fr;
    }

    .side-panel {
        position: static;
        order: -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .panel-card.full {
        grid-column: 1 / -1;
    }
}

@media (max-width: 820px) {
    .header-inner {
        grid-template-columns: 1fr;
    }

    .header-actions {
        justify-content: flex-start;
    }

    .brand h1 {
        font-size: 22px;
    }

    .app-shell {
        padding-left: 12px;
        padding-right: 12px;
        margin-top: 14px;
    }

    .paper-wrap {
        padding: 12px;
    }

    .paper-content {
        padding: 26px 18px 38px;
    }

    .exam-title h2 {
        font-size: 24px;
    }

    .side-panel {
        grid-template-columns: 1fr;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .result-grid {
        grid-template-columns: 1fr 1fr;
    }

    .floating-dock {
        display: grid;
    }

    .hide-small {
        display: none;
    }
}

@media print {
    .app-header,
    .side-panel,
    .floating-dock {
        display: none !important;
    }

    body {
        background: white;
    }

    .app-shell {
        display: block;
        margin: 0;
        padding: 0;
    }

    .glass-card,
    .paper,
    .paper-wrap {
        box-shadow: none;
        border: none;
        background: white;
    }
}
</style>
</head>

<body>

<header class="app-header">
    <div class="header-inner">
        <div class="brand">
            <div class="logo">4</div>
            <div>
                <h1>CET4 Listening Simulator</h1>
                <p>iPad 优化 · 波形拖动 · 真题听力 · 真实分值 · 批注笔记</p>
            </div>
        </div>

        <div class="header-actions">
            <label class="file-btn hide-small">
                手动题目
                <input id="jsonInput" type="file" accept=".json,application/json">
            </label>

            <label class="file-btn hide-small">
                手动音频
                <input id="audioInput" type="file" accept="audio/*">
            </label>

            <button class="purple" id="drawToggleBtn">批注：关</button>
            <button class="red hide-small" id="clearDrawBtn">清空批注</button>
            <button class="primary" id="submitBtn">提交</button>
        </div>
    </div>
</header>

<main class="app-shell">

    <section class="exam-area">
        <div id="resultPanel" class="result-panel"></div>

        <div class="glass-card paper-wrap">
            <div class="paper" id="paper">
                <canvas id="drawCanvas"></canvas>

                <div class="paper-content" id="examContainer">
                    <div class="empty">
                        <h2>请选择一套 CET4 听力题</h2>
                        <p>可以加载 GitHub Pages 内置题目，也可以手动选择 JSON 和音频。</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <aside class="side-panel">

        <section class="panel-card full">
            <h3>内置题目</h3>
            <div class="builtin-row">
                <select id="builtinSelect">
                    <option value="">正在读取题目列表...</option>
                </select>
                <button class="primary" id="loadBuiltinBtn">加载选中题目与音频</button>
            </div>
            <p style="color:var(--muted);font-size:13px;line-height:1.6;margin:12px 2px 0;">
                GitHub Pages 使用时，请把 json/mp3 放在 <b>题目文件夹</b> 内，并配置 manifest.json。
            </p>
        </section>

        <section class="panel-card full">
            <h3>音频控制</h3>

            <div class="audio-player">
                <div class="wave-box">
                    <canvas id="waveform" class="locked-wave" width="760" height="236"></canvas>
                    <div class="wave-tip" id="waveTip">
                        当前波形已锁定。点击“进度锁定”解锁后，可直接拖动波形图定位音频。
                    </div>
                </div>

                <div class="seek-wrap">
                    <div class="time-row">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                    <input id="seek" class="locked" type="range" min="0" max="100" value="0" step="0.1">
                </div>

                <div class="audio-buttons">
                    <button class="primary" id="playBtn">播放</button>
                    <button class="orange" id="lockBtn">进度锁定</button>
                </div>
            </div>
        </section>

        <section class="panel-card">
            <h3>答题状态</h3>
            <div class="progress-big">
                <div class="stat">
                    <b id="doneCount">0</b>
                    <span>已答</span>
                </div>
                <div class="stat">
                    <b id="totalCount">0</b>
                    <span>总题数</span>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-inner" id="progressInner"></div>
            </div>
        </section>

        <section class="panel-card">
            <h3>我的笔记</h3>
            <textarea id="noteArea" class="note-area" placeholder="适合 iPad 输入关键词：
Q1 engine cover
Q10 animal rights
Q15 quarter = 25%"></textarea>
        </section>

    </aside>

</main>

<div class="floating-dock">
    <button class="primary" id="dockPlayBtn">播放</button>
    <button class="orange" id="dockLockBtn">锁定</button>
    <button class="purple" id="dockDrawBtn">批注</button>
    <button class="primary" id="dockTopBtn">顶部</button>
</div>

<audio id="audio"></audio>

<script>
/* =========================
   基础配置
========================= */

const BUILTIN_FOLDER = "题目文件夹/";
const MANIFEST_FILE = BUILTIN_FOLDER + "manifest.json";

/* =========================
   内置题目 manifest
========================= */

async function loadManifest() {
    try {
        const res = await fetch(encodeURI(MANIFEST_FILE), {
            cache: "no-store"
        });

        if (!res.ok) {
            throw new Error("manifest not found");
        }

        manifestList = await res.json();

        if (!Array.isArray(manifestList) || manifestList.length === 0) {
            throw new Error("manifest empty");
        }

        builtinSelect.innerHTML = `<option value="">请选择内置题目</option>`;

        manifestList.forEach((item, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = item.name || item.json || `题目 ${index + 1}`;
            builtinSelect.appendChild(option);
        });

    } catch (err) {
        console.warn(err);
        builtinSelect.innerHTML = `<option value="">未找到 manifest.json</option>`;
    }
}

loadBuiltinBtn.addEventListener("click", async () => {
    const index = builtinSelect.value;

    if (index === "") {
        alert("请先选择一套内置题目。");
        return;
    }

    const item = manifestList[Number(index)];
    if (!item) return;

    try {
        const jsonUrl = encodeURI(BUILTIN_FOLDER + item.json);
        const audioUrl = encodeURI(BUILTIN_FOLDER + item.audio);

        const jsonRes = await fetch(jsonUrl, {
            cache: "no-store"
        });

        if (!jsonRes.ok) {
            throw new Error("题目 JSON 加载失败");
        }

        examData = await jsonRes.json();
        userAnswers = {};
        submitted = false;

        renderExam();
        updateProgress();
        clearResult();

        audio.src = audioUrl;
        audio.load();
        resetAudioState();

        try {
            const audioRes = await fetch(audioUrl);
            const arrayBuffer = await audioRes.arrayBuffer();
            await drawWaveformFromArrayBuffer(arrayBuffer);
        } catch (audioErr) {
            console.warn(audioErr);
            drawWaveformPlaceholder("音频可播放，但波形解析失败");
        }

        setTimeout(resizeDrawCanvas, 300);
        alert("内置题目和音频加载成功。");

    } catch (err) {
        console.error(err);
        alert("加载失败。请检查 manifest.json、json 文件名、mp3 文件名是否正确。");
    }
});

/* =========================
   手动加载
========================= */

jsonInput.addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const text = await file.text();
        examData = JSON.parse(text);

        userAnswers = {};
        submitted = false;

        renderExam();
        updateProgress();
        clearResult();

        setTimeout(resizeDrawCanvas, 300);
        alert("题目 JSON 加载成功。");

    } catch (err) {
        console.error(err);
        alert("JSON 解析失败，请检查文件格式。");
    }
});

audioInput.addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    audio.src = url;
    audio.load();

    resetAudioState();

    try {
        const arrayBuffer = await file.arrayBuffer();
        await drawWaveformFromArrayBuffer(arrayBuffer);
    } catch (err) {
        console.error(err);
        drawWaveformPlaceholder("音频可播放，但波形解析失败");
    }
});

/* =========================
   渲染试卷
========================= */

function renderExam() {
    if (!examData?.listening?.sections) {
        examContainer.innerHTML = `
            <div class="empty">
                <h2>题目格式不正确</h2>
                <p>没有找到 listening.sections。</p>
            </div>
        `;
        return;
    }

    const meta = examData.exam_meta || {};
    const sections = examData.listening.sections;

    let html = `
        <div class="exam-title">
            <h2>大学英语四级考试听力模拟</h2>
            <p>${escapeHTML(meta.exam_date || "")} ${escapeHTML(meta.set_label || "")}　Listening Comprehension</p>
        </div>

        <div class="notice">
            <b>听力考试说明：</b>
            本页面按照 CET4 听力题组排列。默认情况下音频进度与波形图均被锁定，模拟正式考试；
            解锁后可以拖动进度条，也可以直接拖动波形图定位音频。
            分数按照 CET4 听力真实分值计算：1-15 题每题 7.1 分，16-25 题每题 14.2 分，总分 248.5 分。
        </div>
    `;

    sections.forEach(section => {
        const groups = section.groups || [];
        const qCount = groups.reduce((sum, g) => sum + ((g.questions || []).length), 0);

        html += `
            <section class="section">
                <div class="section-heading">
                    <h3>${escapeHTML(section.section_label || "")}</h3>
                    <span>${qCount} Questions</span>
                </div>

                <div class="directions">${escapeHTML(section.directions || "")}</div>
        `;

        groups.forEach(group => {
            html += `
                <article class="group">
                    <div class="group-top">
                        <div class="group-title">${escapeHTML(group.material?.title || "Untitled")}</div>
                        <div class="pill">${escapeHTML(formatGroupType(group.group_type))}</div>
                    </div>

                    <div class="group-intro">${escapeHTML(group.group_intro || "")}</div>

                    <details>
                        <summary>Transcript / 听力原文</summary>
                        <div class="transcript">${escapeHTML(group.material?.transcript || "")}</div>
                    </details>
            `;

            (group.questions || []).forEach(q => {
                html += renderQuestion(q);
            });

            html += `</article>`;
        });

        html += `</section>`;
    });

    examContainer.innerHTML = html;
    bindOptionEvents();
}

function renderQuestion(q) {
    const no = String(q.question_no);
    const options = q.options || {};

    let html = `
        <div class="question" id="q-${no}">
            <div class="q-stem">${no}. ${escapeHTML(q.stem || "")}</div>
            <div class="options">
    `;

    ["A", "B", "C", "D"].forEach(letter => {
        if (!options[letter]) return;

        html += `
            <label class="option" data-question="${no}" data-option="${letter}">
                <input type="radio" name="q-${no}" value="${letter}">
                <span><b>${letter})</b> ${escapeHTML(options[letter])}</span>
            </label>
        `;
    });

    html += `
            </div>
            <div class="analysis" id="analysis-${no}"></div>
        </div>
    `;

    return html;
}

function bindOptionEvents() {
    document.querySelectorAll(".option").forEach(optionEl => {
        optionEl.addEventListener("click", () => {
            if (submitted) return;

            const qNo = optionEl.dataset.question;
            const option = optionEl.dataset.option;

            userAnswers[qNo] = option;

            document.querySelectorAll(`.option[data-question="${qNo}"]`).forEach(el => {
                el.classList.remove("selected");
            });

            optionEl.classList.add("selected");
            optionEl.querySelector("input").checked = true;

            updateProgress();
        });
    });
}

/* =========================
   CET4 听力真实分值
========================= */

function getQuestionScore(questionNo) {
    const no = Number(questionNo);

    if (no >= 1 && no <= 15) return 7.1;
    if (no >= 16 && no <= 25) return 14.2;

    return 0;
}

function getAllQuestions() {
    if (!examData?.listening?.sections) return [];

    const questions = [];

    examData.listening.sections.forEach(section => {
        (section.groups || []).forEach(group => {
            (group.questions || []).forEach(q => questions.push(q));
        });
    });

    return questions.sort((a, b) => Number(a.question_no) - Number(b.question_no));
}

function submitExam() {
    if (!examData) {
        alert("请先加载题目。");
        return;
    }

    const questions = getAllQuestions();

    if (!questions.length) {
        alert("没有可提交的题目。");
        return;
    }

    const unanswered = questions.filter(q => !userAnswers[String(q.question_no)]);

    if (unanswered.length > 0) {
        const ok = confirm(`还有 ${unanswered.length} 题没有作答，确定提交吗？`);
        if (!ok) return;
    }

    submitted = true;

    let correctCount = 0;
    let realScore = 0;
    let wrongList = [];

    questions.forEach(q => {
        const no = String(q.question_no);
        const correct = getCorrectAnswer(q);
        const user = userAnswers[no] || "";
        const isCorrect = user === correct;

        if (isCorrect) {
            correctCount++;
            realScore += getQuestionScore(no);
        } else {
            wrongList.push({
                no,
                user: user || "未答",
                correct,
                score: getQuestionScore(no)
            });
        }

        markQuestion(no, user, correct);
        showAnalysis(q, user, correct);
    });

    realScore = round1(realScore);

    const total = questions.length;
    const accuracy = Math.round(correctCount / total * 100);
    const maxScore = 248.5;

    resultPanel.classList.add("show");
    resultPanel.innerHTML = `
        <h2>听力成绩</h2>

        <div class="result-grid">
            <div class="result-tile">
                <b>${realScore}</b>
                <span>CET4 听力分 / ${maxScore}</span>
            </div>
            <div class="result-tile">
                <b>${correctCount}</b>
                <span>正确题数 / ${total}</span>
            </div>
            <div class="result-tile">
                <b>${accuracy}%</b>
                <span>正确率</span>
            </div>
            <div class="result-tile">
                <b>${round1(maxScore - realScore)}</b>
                <span>丢分</span>
            </div>
        </div>

        <div class="wrong-list">
            <b>错题 / 未答：</b><br>
            ${
                wrongList.length
                ? wrongList.map(item =>
                    `第 ${item.no} 题：你的答案 ${item.user}，正确答案 ${item.correct}，本题 ${item.score} 分`
                  ).join("<br>")
                : "全部正确，非常优秀。"
            }
        </div>
    `;

    resultPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function getCorrectAnswer(q) {
    const no = String(q.question_no);
    return q.answer || examData.answer_key?.[no] || "";
}

function markQuestion(no, user, correct) {
    document.querySelectorAll(`.option[data-question="${no}"]`).forEach(el => {
        const opt = el.dataset.option;

        if (opt === correct) {
            el.classList.add("correct");
        }

        if (opt === user && user !== correct) {
            el.classList.add("wrong");
        }
    });
}

function showAnalysis(q, user, correct) {
    const no = String(q.question_no);
    const box = document.getElementById(`analysis-${no}`);
    if (!box) return;

    const detail = q.answer_detail || {};
    const evidence = detail.evidence || [];
    const score = getQuestionScore(no);

    box.classList.add("show");

    box.innerHTML = `
        <div>本题分值：<b>${score} 分</b></div>

        <div>
            正确答案：
            <span class="correct-text">${correct}) ${escapeHTML(q.options?.[correct] || "")}</span>
        </div>

        <div>
            你的答案：
            ${
                user === correct
                ? `<span class="correct-text">${user || "未答"}</span>`
                : `<span class="wrong-text">${user || "未答"}</span>`
            }
        </div>

        <div style="margin-top:8px;">
            <b>解析：</b>
            ${escapeHTML(detail.analysis || "暂无解析。")}
        </div>

        ${
            evidence.length
            ? `
                <div style="margin-top:8px;">
                    <b>原文依据：</b>
                    ${evidence.map(e => `
                        <div style="margin-top:7px;">
                            <em>“${escapeHTML(e.quote || "")}”</em><br>
                            <span style="color:var(--muted);">${escapeHTML(e.reason || "")}</span>
                        </div>
                    `).join("")}
                </div>
            `
            : ""
        }
    `;
}

   音频控制
========================= */

playBtn.addEventListener("click", togglePlay);
dockPlayBtn.addEventListener("click", togglePlay);

function togglePlay() {
    if (!audio.src) {
        alert("请先加载音频。");
        return;
    }

    if (audio.paused) {
        audio.play();
        playBtn.textContent = "暂停";
        dockPlayBtn.textContent = "暂停";
    } else {
        audio.pause();
        playBtn.textContent = "播放";
        dockPlayBtn.textContent = "播放";
    }
}

lockBtn.addEventListener("click", toggleAudioLock);
dockLockBtn.addEventListener("click", toggleAudioLock);

function toggleAudioLock() {
    audioUnlocked = !audioUnlocked;

    if (audioUnlocked) {
        seek.classList.remove("locked");
        waveform.classList.remove("locked-wave");

        lockBtn.textContent = "已解锁";
        dockLockBtn.textContent = "解锁";

        lockBtn.classList.remove("orange");
        lockBtn.classList.add("green");

        dockLockBtn.classList.remove("orange");
        dockLockBtn.classList.add("green");

        waveTip.textContent = "已解锁：可在波形图上点击或拖动，直接定位音频。";
    } else {
        seek.classList.add("locked");
        waveform.classList.add("locked-wave");

        lockBtn.textContent = "进度锁定";
        dockLockBtn.textContent = "锁定";

        lockBtn.classList.remove("green");
        lockBtn.classList.add("orange");

        dockLockBtn.classList.remove("green");
        dockLockBtn.classList.add("orange");

        waveTip.textContent = "当前波形已锁定。点击“进度锁定”解锁后，可直接拖动波形图定位音频。";
    }

    drawWaveformFrame();
}

seek.addEventListener("input", () => {
    if (!audioUnlocked) return;
    if (!audio.duration) return;

    audio.currentTime = Number(seek.value);
    drawWaveformFrame();
});

audio.addEventListener("loadedmetadata", () => {
    seek.max = audio.duration || 100;
    durationTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;

    seek.max = audio.duration;
    seek.value = audio.currentTime;

    currentTimeEl.textContent = formatTime(audio.currentTime);
    durationTimeEl.textContent = formatTime(audio.duration);

    drawWaveformFrame();
});

audio.addEventListener("ended", () => {
    playBtn.textContent = "播放";
    dockPlayBtn.textContent = "播放";
});

function resetAudioState() {
    audioUnlocked = false;
    isWaveDragging = false;
    waveHoverX = null;

    seek.value = 0;
    seek.classList.add("locked");
    waveform.classList.add("locked-wave");

    playBtn.textContent = "播放";
    dockPlayBtn.textContent = "播放";

    lockBtn.textContent = "进度锁定";
    dockLockBtn.textContent = "锁定";

    lockBtn.classList.remove("green");
    lockBtn.classList.add("orange");

    dockLockBtn.classList.remove("green");
    dockLockBtn.classList.add("orange");

    currentTimeEl.textContent = "00:00";
    durationTimeEl.textContent = "00:00";

    waveTip.textContent = "当前波形已锁定。点击“进度锁定”解锁后，可直接拖动波形图定位音频。";
}

/* =========================
   可拖动波形图
========================= */

async function drawWaveformFromArrayBuffer(arrayBuffer) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    const buffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));

    audioBufferData = buffer;
    drawWaveformFrame();

    audioCtx.close();
}

function drawWaveformFrame() {
    if (!audioBufferData) {
        drawWaveformPlaceholder("请加载音频");
        return;
    }

    drawWaveformBase(audioBufferData);
    drawWaveformProgress();
    drawWaveformCursor();
    drawWaveformLockOverlay();
}

function drawWaveformBase(buffer) {
    const width = waveform.width;
    const height = waveform.height;

    const data = buffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    waveCtx.clearRect(0, 0, width, height);

    const bg = waveCtx.createLinearGradient(0, 0, width, height);
    bg.addColorStop(0, "#061224");
    bg.addColorStop(1, "#111d38");
    waveCtx.fillStyle = bg;
    waveCtx.fillRect(0, 0, width, height);

    waveCtx.strokeStyle = "rgba(255,255,255,0.13)";
    waveCtx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const y = height * i / 4;
        waveCtx.beginPath();
        waveCtx.moveTo(0, y);
        waveCtx.lineTo(width, y);
        waveCtx.stroke();
    }

    const grad = waveCtx.createLinearGradient(0, 0, width, 0);
    grad.addColorStop(0, "#5ac8fa");
    grad.addColorStop(0.5, "#007aff");
    grad.addColorStop(1, "#af52de");

    waveCtx.strokeStyle = grad;
    waveCtx.lineWidth = 2;
    waveCtx.beginPath();

    for (let i = 0; i < width; i++) {
        let min = 1;
        let max = -1;

        for (let j = 0; j < step; j++) {
            const datum = data[i * step + j] || 0;
            if (datum < min) min = datum;
            if (datum > max) max = datum;
        }

        waveCtx.moveTo(i, (1 + min) * amp);
        waveCtx.lineTo(i, (1 + max) * amp);
    }

    waveCtx.stroke();

    waveCtx.strokeStyle = "rgba(255,255,255,0.2)";
    waveCtx.lineWidth = 1;
    waveCtx.beginPath();
    waveCtx.moveTo(0, height / 2);
    waveCtx.lineTo(width, height / 2);
    waveCtx.stroke();
}

function drawWaveformProgress() {
    if (!audio.duration) return;

    const width = waveform.width;
    const height = waveform.height;
    const progressX = audio.currentTime / audio.duration * width;

    const fill = waveCtx.createLinearGradient(0, 0, progressX, 0);
    fill.addColorStop(0, "rgba(255,149,0,0.22)");
    fill.addColorStop(1, "rgba(255,204,0,0.14)");

    waveCtx.fillStyle = fill;
    waveCtx.fillRect(0, 0, progressX, height);

    waveCtx.strokeStyle = "#ff9500";
    waveCtx.lineWidth = 4;
    waveCtx.beginPath();
    waveCtx.moveTo(progressX, 0);
    waveCtx.lineTo(progressX, height);
    waveCtx.stroke();

    waveCtx.fillStyle = "#ff9500";
    waveCtx.beginPath();
    waveCtx.arc(progressX, height / 2, 8, 0, Math.PI * 2);
    waveCtx.fill();
}

function drawWaveformCursor() {
    if (waveHoverX === null || !audioUnlocked) return;

    const height = waveform.height;

    waveCtx.strokeStyle = "rgba(255,255,255,0.72)";
    waveCtx.lineWidth = 2;
    waveCtx.setLineDash([6, 6]);
    waveCtx.beginPath();
    waveCtx.moveTo(waveHoverX, 0);
    waveCtx.lineTo(waveHoverX, height);
    waveCtx.stroke();
    waveCtx.setLineDash([]);

    if (audio.duration) {
        const seconds = waveHoverX / waveform.width * audio.duration;
        const label = formatTime(seconds);
        const labelWidth = 64;
        const x = Math.min(Math.max(waveHoverX - labelWidth / 2, 6), waveform.width - labelWidth - 6);

        waveCtx.fillStyle = "rgba(255,255,255,0.9)";
        roundRect(waveCtx, x, 10, labelWidth, 28, 12);
        waveCtx.fill();

        waveCtx.fillStyle = "#102033";
        waveCtx.font = "15px -apple-system, BlinkMacSystemFont, sans-serif";
        waveCtx.textAlign = "center";
        waveCtx.textBaseline = "middle";
        waveCtx.fillText(label, x + labelWidth / 2, 24);
    }
}

function drawWaveformLockOverlay() {
    if (audioUnlocked) return;

    const width = waveform.width;
    const height = waveform.height;

    waveCtx.fillStyle = "rgba(0,0,0,0.22)";
    waveCtx.fillRect(0, 0, width, height);

    waveCtx.fillStyle = "rgba(255,255,255,0.86)";
    waveCtx.font = "22px -apple-system, BlinkMacSystemFont, sans-serif";
    waveCtx.textAlign = "center";
    waveCtx.textBaseline = "middle";
    waveCtx.fillText("进度已锁定", width / 2, height / 2 - 10);

    waveCtx.fillStyle = "rgba(255,255,255,0.62)";
    waveCtx.font = "16px -apple-system, BlinkMacSystemFont, sans-serif";
    waveCtx.fillText("解锁后可拖动波形", width / 2, height / 2 + 20);
}

function drawWaveformPlaceholder(text) {
    waveCtx.clearRect(0, 0, waveform.width, waveform.height);

    const bg = waveCtx.createLinearGradient(0, 0, waveform.width, waveform.height);
    bg.addColorStop(0, "#061224");
    bg.addColorStop(1, "#111d38");

    waveCtx.fillStyle = bg;
    waveCtx.fillRect(0, 0, waveform.width, waveform.height);

    waveCtx.fillStyle = "rgba(255,255,255,0.78)";
    waveCtx.font = "24px -apple-system, BlinkMacSystemFont, sans-serif";
    waveCtx.textAlign = "left";
    waveCtx.textBaseline = "middle";
    waveCtx.fillText(text, 28, waveform.height / 2);
}

function seekAudioByWavePointer(event) {
    if (!audioUnlocked) return;
    if (!audio.duration) return;

    const rect = waveform.getBoundingClientRect();
    const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
    const newTime = ratio * audio.duration;

    audio.currentTime = newTime;
    seek.value = newTime;
    currentTimeEl.textContent = formatTime(newTime);

    waveHoverX = ratio * waveform.width;
    drawWaveformFrame();
}

function updateWaveHover(event) {
    const rect = waveform.getBoundingClientRect();
    const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
    waveHoverX = ratio * waveform.width;
    drawWaveformFrame();
}

waveform.addEventListener("pointerdown", event => {
    if (!audio.src) {
        alert("请先加载音频。");
        return;
    }

    if (!audioUnlocked) {
        waveTip.textContent = "波形图当前被锁定，请先点击“进度锁定”解锁。";
        drawWaveformFrame();
        return;
    }

    isWaveDragging = true;
    waveform.setPointerCapture(event.pointerId);
    seekAudioByWavePointer(event);
});

waveform.addEventListener("pointermove", event => {
    if (!audioBufferData) return;

    updateWaveHover(event);

    if (isWaveDragging && audioUnlocked) {
        seekAudioByWavePointer(event);
    }
});

waveform.addEventListener("pointerup", event => {
    isWaveDragging = false;
    try {
        waveform.releasePointerCapture(event.pointerId);
    } catch (e) {}
});

waveform.addEventListener("pointercancel", () => {
    isWaveDragging = false;
});

waveform.addEventListener("pointerleave", () => {
    if (!isWaveDragging) {
        waveHoverX = null;
        drawWaveformFrame();
    }
});

/* =========================
   批注功能
========================= */

drawToggleBtn.addEventListener("click", toggleDrawing);
dockDrawBtn.addEventListener("click", toggleDrawing);

function toggleDrawing() {
    drawingEnabled = !drawingEnabled;

    if (drawingEnabled) {
        drawCanvas.classList.add("enabled");

        drawToggleBtn.textContent = "批注：开";
        dockDrawBtn.textContent = "批注开";

        drawToggleBtn.classList.remove("purple");
        drawToggleBtn.classList.add("green");

        dockDrawBtn.classList.remove("purple");
        dockDrawBtn.classList.add("green");
    } else {
        drawCanvas.classList.remove("enabled");

        drawToggleBtn.textContent = "批注：关";
        dockDrawBtn.textContent = "批注";

        drawToggleBtn.classList.remove("green");
        drawToggleBtn.classList.add("purple");

        dockDrawBtn.classList.remove("green");
        dockDrawBtn.classList.add("purple");
    }
}

clearDrawBtn.addEventListener("click", () => {
    if (confirm("确定清空所有批注吗？")) {
        clearDrawing();
    }
});

function resizeDrawCanvas() {
    const old = document.createElement("canvas");
    old.width = drawCanvas.width;
    old.height = drawCanvas.height;

    if (drawCanvas.width && drawCanvas.height) {
        old.getContext("2d").drawImage(drawCanvas, 0, 0);
    }

    drawCanvas.width = paper.scrollWidth;
    drawCanvas.height = paper.scrollHeight;

    drawCtx.drawImage(old, 0, 0);

    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    drawCtx.strokeStyle = "rgba(255, 59, 48, 0.86)";
    drawCtx.lineWidth = 4;
}

function clearDrawing() {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}

drawCanvas.addEventListener("pointerdown", event => {
    if (!drawingEnabled) return;

    isDrawing = true;
    drawCanvas.setPointerCapture(event.pointerId);

    const pos = getCanvasPos(event);
    lastX = pos.x;
    lastY = pos.y;
});

drawCanvas.addEventListener("pointermove", event => {
    if (!drawingEnabled || !isDrawing) return;

    const pos = getCanvasPos(event);

    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();

    lastX = pos.x;
    lastY = pos.y;
});

drawCanvas.addEventListener("pointerup", event => {
    isDrawing = false;
    try {
        drawCanvas.releasePointerCapture(event.pointerId);
    } catch (e) {}
});

drawCanvas.addEventListener("pointercancel", () => {
    isDrawing = false;
});

function getCanvasPos(event) {
    const rect = drawCanvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

function formatGroupType(type) {
    const map = {
        news_report: "News Report",
        conversation: "Conversation",
        passage: "Passage"
    };

    return map[type] || type || "";
}

function escapeHTML(str) {
    return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00";

    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);

    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function round1(num) {
    return Math.round(num * 10) / 10;
}

function clamp(num, min, max) {
    return Math.min(Math.max(num, min), max);
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
